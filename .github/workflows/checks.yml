name: Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    # Standard runners are free for public repos under current GitHub pricing.
    # Do not run this job if repository visibility changes to private.
    if: github.event.repository.private == false && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          # Deliberately omit dependency caching and artifact uploads.
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: npm test -- --runInBand
