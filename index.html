<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="prefetch" href="generator/index.html?v=20261110-marker-visibility" as="document">
  <meta name="description" content="Choose a bar design and create an RPI logo with The Bar Generator.">
  <title>The Bar Generator | RPI</title>
  <link href="css/marquee-ui.css?v=20261110-marquee-all-rows" rel="stylesheet" type="text/css">
  <link href="css/page-entrance.css?v=20261104-letter-resolve" rel="stylesheet" type="text/css">
  <script src="js/utils/asciiEntrance.js?v=20261110-combined-brand-refinement"></script>
  <script src="js/utils/pageEntrance.js?v=20261110-home-ascii-duration" data-entry-kind="selector"></script>
  <script src="js/utils/generatorRoutes.js?v=20261110-combined-brand-refinement"></script>
  <script>
    const legacyGeneratorUrl = window.GeneratorRoutes
      ? window.GeneratorRoutes.getLegacyGeneratorRedirectUrl(window.location.pathname, window.location.search)
      : null;

    if (legacyGeneratorUrl) {
      window.location.replace(legacyGeneratorUrl);
    }
  </script>
</head>

<body>
  <div class="page-wrapper marquee_page">
    <main class="main-wrapper">
      <a class="marquee_skip-link" href="generator/solid/" aria-describedby="marquee-motion-description">Open the generator and choose a bar style</a>
      <span class="marquee_visually-hidden" id="marquee-motion-description" role="status">Press Space to pause or resume scrolling. Dragging still works while paused.</span>
      <section class="section_marquee_hero" data-entrance-page="selector" aria-label="Bar designs" aria-keyshortcuts="Space" aria-describedby="marquee-motion-description">
        <div class="marquee_scene" data-entrance-plane="selector">
          <div class="marquee_stage" id="marquee-stage" data-marquee-stage></div>
        </div>

        <div id="startup-style-prompt" class="startup_prompt" aria-hidden="true" role="status" aria-live="polite"
          aria-atomic="true">
          <div class="startup_prompt_inner">
            <p class="startup_prompt_text">Select a bar design below to get started</p>
          </div>
        </div>

        <div class="padding-global hero_shell">
          <div class="container-large hero_layout">
            <div class="hero_cluster" data-page-entrance>
              <div class="hero_copy">
                <div class="hero_brand" role="img" aria-label="RPI logo"></div>
                <h1 class="hero_title">
                  <span class="hero_title-line is-top">The Bar</span>
                  <span class="hero_title-line is-bottom">Generator</span>
                </h1>
              </div>

              <div class="hero_credit" aria-label="Made in RCOS by Kaden Tennent and Dakota Pace">
                <p class="credit_line">
                  <span>Made in RCOS</span>
                  <span class="credit_logo" aria-hidden="true"></span>
                </p>
                <p class="credit_line">By Kaden Tennent &amp; Dakota Pace</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/utils/marqueeCatalog.js?v=20261110-combined-generator-candidate"></script>
  <script src="js/marqueeUi.js?v=20261110-marquee-all-rows"></script>
  <script src="js/utils/mobileBrowser.js?v=20261105-safari-top-theme"></script>
</body>

</html>
