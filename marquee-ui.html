<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Experimental next-gen marquee interface for the RPI Bar Generator.">
  <title>RPI Bar Generator Marquee Experiment</title>
  <link href="css/marquee-ui.css?v=20261104-home-playful-integrated" rel="stylesheet" type="text/css">
  <link href="css/page-entrance.css?v=20261104-ascii-wake" rel="stylesheet" type="text/css">
  <script src="js/utils/asciiEntrance.js?v=20261104-ascii-wake"></script>
  <script src="js/utils/pageEntrance.js?v=20261104-ascii-wake" data-entry-kind="selector"></script>
  <script src="js/utils/generatorRoutes.js?v=20261103-nucleotide"></script>
  <script>
    const legacyGeneratorUrl = window.GeneratorRoutes
      ? window.GeneratorRoutes.getLegacyGeneratorRedirectUrl(window.location.pathname, window.location.search)
      : null;

    if (legacyGeneratorUrl) {
      window.location.replace(legacyGeneratorUrl);
    }
  </script>
</head>

<body>
  <div class="page-wrapper marquee_page">
    <main class="main-wrapper">
      <a class="marquee_skip-link" href="generator/solid/">Open the generator and choose a bar style</a>
      <section class="section_marquee_hero" data-entrance-page="selector">
        <div class="marquee_scene" data-entrance-plane="selector">
          <div class="marquee_stage" id="marquee-stage" data-marquee-stage></div>
        </div>

        <div id="startup-style-prompt" class="startup_prompt" aria-hidden="true" role="status" aria-live="polite"
          aria-atomic="true">
          <div class="startup_prompt_inner">
            <p class="startup_prompt_text">Select a bar design below to get started</p>
          </div>
        </div>

        <div class="padding-global hero_shell">
          <div class="container-large hero_layout">
            <div class="hero_cluster" data-page-entrance>
              <div class="hero_copy">
                <div class="hero_brand" role="img" aria-label="RPI logo"></div>
                <h1 class="hero_title">
                  <span class="hero_title-line is-top">The Bar</span>
                  <span class="hero_title-line is-bottom">Generator</span>
                </h1>
              </div>

              <div class="hero_credit" aria-label="Made in RCOS by Kaden Tennent and Dakota Pace">
                <p class="credit_line">
                  <span>Made in RCOS</span>
                  <span class="credit_logo" aria-hidden="true"></span>
                </p>
                <p class="credit_line">By Kaden Tennent &amp; Dakota Pace</p>
              </div>
            </div>
            <div class="hero_controls" data-marquee-controls data-page-entrance>
              <a class="hero_generator-link" href="generator/solid/">
                <span>Enter generator</span>
                <svg data-feather="chevron-down" class="hero_entrance-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </a>
              <button class="hero_motion-control" id="marquee-motion-toggle" type="button"
                aria-label="Pause motion" aria-controls="marquee-stage" aria-describedby="marquee-motion-description"
                data-motion-paused="false" hidden>
                <svg data-feather="pause" class="hero_motion-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                <svg data-feather="play" class="hero_motion-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              </button>
              <span class="marquee_visually-hidden" id="marquee-motion-description">Controls the moving rows and animated bar previews. Dragging still works while paused.</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/utils/marqueeCatalog.js?v=20261104-nucleotide-minimum"></script>
  <script src="js/utils/marqueeAnimation.js?v=20261104-preview-hover-hold"></script>
  <script src="js/marqueeUi.js?v=20261104-neighbors-final"></script>
  <script src="js/utils/mobileBrowser.js?v=20261105-safari-top-theme"></script>
</body>

</html>
